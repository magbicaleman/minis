<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;"><title>Take action · tactile button</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f2f9;color:#514a62}main{height:100%;min-height:380px;display:grid;place-items:center;position:relative;overflow:hidden}.assembly{position:relative;width:288px;height:96px;transform:translateY(0)}.base{position:absolute;inset:8px 0 0;height:88px;background:linear-gradient(#7130e0,#5a21bb);border-radius:22px;box-shadow:0 10px 18px #44237822,0 2px 3px #3c175429}.action{position:absolute;inset:0;width:288px;height:90px;padding:0;border:1.5px solid #c7a4ff;border-radius:22px;cursor:pointer;background:linear-gradient(180deg,#a16aff 0%,#8d4cf6 25%,#803bef 65%,#8745f3 100%);color:#fff;box-shadow:inset 0 2px 3px #fff7,inset 0 -2px 3px #c09affcc,inset 3px 0 7px #ceb2ff66,inset -3px 0 7px #ceb2ff66,0 0 2px #9f65ed;transform:translateY(0);transition:transform 160ms cubic-bezier(.2,.8,.3,1.4),filter 150ms;isolation:isolate;touch-action:none;-webkit-tap-highlight-color:transparent}.action.down{transform:translateY(7px);filter:saturate(.91);transition:transform 75ms ease-out}.action:focus-visible{outline:3px solid #5420ac;outline-offset:8px}.surface{position:absolute;inset:0;overflow:hidden;border-radius:21px;pointer-events:none}.surface:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 48% 0%,#ffffff12,transparent 60%);box-shadow:inset 0 0 9px #d6b8ff55;border-radius:inherit}.label{position:relative;z-index:2;font-size:34px;letter-spacing:-.9px;font-weight:600;line-height:1;text-shadow:0 1px 2px #7032be44;pointer-events:none}.print{position:absolute;width:86px;height:100px;margin:-50px 0 0 -43px;opacity:0;mix-blend-mode:screen;will-change:opacity;pointer-events:none}.cursor{position:absolute;width:18px;height:23px;z-index:4;pointer-events:none;opacity:0;filter:drop-shadow(0 1px 1px #0006);transform:translate(-3px,-3px)}footer{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:12px;color:#9990a6}nav{display:flex;justify-content:center;gap:10px;margin-top:14px}nav button{font:inherit;border:1px solid #ddd5e8;background:#ffffff66;color:#756687;border-radius:20px;padding:8px 14px;cursor:pointer}nav button:hover{background:white}nav button:focus-visible{outline:2px solid #8750d8;outline-offset:3px}@media(max-width:420px){.assembly{transform:scale(.83)}footer{bottom:22px}}
@media(prefers-reduced-motion:reduce){.action{transition:none!important}}
</style></head><body><main><div class="assembly"><div class="base"></div><button class="action" aria-label="take action"><span class="surface"></span><span class="label">take action</span></button><svg class="cursor" viewBox="0 0 18 23"><path d="M5 12V3c0-2 3-2 3 0v6c1-2 3-1 3 0 2-1 3 0 3 2 2 0 3 1 2 4l-2 6H6l-4-7c-1-2 1-3 3-2Z" fill="white" stroke="#3a3048" stroke-width="1.2"/></svg></div><footer><span id="hint">Press and leave a trace.</span><nav><button id="replay">Replay animation</button><button id="clear">Clear fingerprints</button></nav></footer></main>
<script>
const button=document.querySelector('.action'),surface=document.querySelector('.surface'),cursor=document.querySelector('.cursor'),hint=document.querySelector('#hint');
let marks=[],timers=[],running=false,held=false;
// Procedural, fictional ridge patterns. No external images or dependencies.
function fingerprint(x,y,angle){
 const el=document.createElement('div');el.className='print';el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`rotate(${angle}deg)`;
 let paths='';
 for(let r=3;r<48;r+=1.65){let d='';for(let i=0;i<=160;i++){let a=i/160*Math.PI*2;let wobble=Math.sin(a*3+r*.14)*1.0+Math.sin(a*7+r*.4)*.38;let xx=50+Math.cos(a)*(r*.78+wobble)+Math.sin(a*2)*r*.1;let yy=57+Math.sin(a)*(r+wobble);d+=(i?'L':'M')+xx.toFixed(2)+','+yy.toFixed(2)}paths+=`<path d="${d}" stroke-opacity="${.42+Math.sin(r*1.7)*.18}"/>`}
 el.innerHTML=`<svg viewBox="0 0 100 116" width="100%" height="100%"><defs><radialGradient id="m"><stop offset="45%" stop-color="white"/><stop offset="100%" stop-color="black"/></radialGradient><mask id="fade"><ellipse cx="50" cy="57" rx="40" ry="51" fill="url(#m)"/></mask></defs><g fill="none" stroke="white" stroke-width=".82" mask="url(#fade)">${paths}</g></svg>`;
 surface.append(el);let born=performance.now();marks.push({el,born});return el;
}
function stop(){timers.forEach(clearTimeout);timers=[];running=false;cursor.style.opacity=0;button.classList.remove('down')}
function later(fn,t){timers.push(setTimeout(fn,t))}
function press(x,y,angle=0){button.classList.add('down');fingerprint(x,y,angle)}
function replay(){stop();marks.forEach(m=>m.el.remove());marks=[];running=true;hint.textContent='Playing the captured gesture sequence';
 // Approximate press moments inferred from timestamped transition crops.
 const taps=[[820,55,49,-24],[1580,245,48,24],[2240,63,47,-19],[3250,139,48,7],[4000,28,31,-40],[4740,130,47,-28],[6030,113,53,28],[6600,45,39,-32],[7170,172,45,12]];
 taps.forEach(([t,x,y,a])=>{later(()=>{cursor.style.opacity=1;cursor.style.left=x+'px';cursor.style.top=y+'px';},t-190);later(()=>press(x,y,a),t);later(()=>button.classList.remove('down'),t+130)});
 later(()=>{cursor.style.opacity=0;running=false;hint.textContent='Press and leave a trace.'},8200);
}
button.addEventListener('pointerdown',e=>{stop();held=true;button.setPointerCapture(e.pointerId);let r=button.getBoundingClientRect();press((e.clientX-r.left)/r.width*288,(e.clientY-r.top)/r.height*90,((e.clientX-r.left)/r.width-.5)*55);hint.textContent='Every touch leaves a fading fingerprint.'});
function release(){held=false;button.classList.remove('down')}
button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);
button.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();stop();press(144,45,-10)}});button.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')release()});
document.querySelector('#replay').onclick=replay;document.querySelector('#clear').onclick=()=>{stop();marks.forEach(m=>m.el.remove());marks=[];hint.textContent='Press and leave a trace.'};
function frame(now){marks=marks.filter(m=>{const age=now-m.born;if(age>5400){m.el.remove();return false}m.el.style.opacity=(Math.min(age/110,1)*Math.pow(Math.max(0,1-age/5400),1.1)*.7).toFixed(3);return true});requestAnimationFrame(frame)}requestAnimationFrame(frame);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)replay();
</script></body></html>
