<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Take action — a tactile button</title>
<style>
  :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; background: #f5f2f8; color: #716879; }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 260px; min-height: 100svh; overflow: hidden; }
  button { font: inherit; -webkit-tap-highlight-color: transparent; }
  main { min-height: 100svh; display: grid; place-items: center; }
  .stage { position: relative; width: min(100vw, calc(100svh * 1.35), 1048px); aspect-ratio: 524 / 388; }
  .button-position { position: absolute; left: 50%; top: 50%; width: 184px; height: 64px; margin: -29px 0 0 -92px; transform: scale(var(--stage-scale, 1)); transform-origin: 50% 29px; }
  .action { position: relative; display: block; width: 184px; height: 64px; border: 0; padding: 0; background: none; border-radius: 13px; cursor: pointer; touch-action: none; user-select: none; outline: none; }
  .action:focus-visible::after { content: ''; position: absolute; inset: -5px; border: 1.5px solid #b699db; border-radius: 18px; }
  .shadow { position: absolute; inset: 10px 1px 1px; border-radius: 13px; background: #4d176e; filter: blur(7px); opacity: .19; transform: translateY(5px); pointer-events: none; }
  .base { position: absolute; inset: 6px 0 0; border-radius: 13px; background: linear-gradient(180deg, #7529db 30%, #6421c8 90%, #702bd4); box-shadow: 0 1px 1px #642ab322, inset 0 -1px 1px #47127a33; pointer-events: none; }
  .face { position: absolute; inset: 0 0 6px; overflow: hidden; isolation: isolate; border-radius: 13px; background: linear-gradient(180deg, #a66bfc 0%, #975afa 15%, #8b49f6 46%, #8540f0 78%, #9256f5 100%); box-shadow: inset 0 1.2px 1.4px #ead6ffa6, inset 1px 0 2px #dcc0ff66, inset -1px 0 2px #dcc0ff4a, inset 0 -1.1px 1px #e6cdffb3, inset 0 0 7px #c6a2ff66; transform-origin: 50% 100%; will-change: transform; pointer-events: none; }
  .face::before { content: ''; position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #e0c5ff20, transparent 30%, #6d2cd609 70%, #ede0ff13), radial-gradient(ellipse at 24% 5%, #d6b5ff20, transparent 65%); }
  .face::after { content: ''; position: absolute; z-index: 3; inset: .65px; border: .7px solid #ead2ff55; border-bottom: 1px solid #ebd5ff99; border-radius: 12.5px; box-shadow: inset 0 1px 3px #e7cfff33; }
  #prints { position: absolute; inset: 0; width: 184px; height: 58px; z-index: 1; }
  .label { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; padding-bottom: 1px; color: #fff; font-size: 24px; font-weight: 600; line-height: 1; letter-spacing: -.55px; text-shadow: 0 .65px 1px #5f26a71f; -webkit-font-smoothing: antialiased; }
  .demo-cursor { position: absolute; left: 0; top: 0; z-index: 5; width: 13px; height: 17px; pointer-events: none; opacity: 0; filter: drop-shadow(0 .65px .5px #230e372e); }
  .demo-cursor svg { width: 100%; height: 100%; overflow: visible; }
  footer { position: fixed; bottom: max(27px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; padding: 0 18px; }
  .hint { margin: 0 0 13px; color: #978d9e; font-size: 11px; line-height: 1.5; letter-spacing: .025em; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .control { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #dcd3e54d; border-radius: 20px; padding: 7px 11px; background: #fff6; color: #83748f; font-size: 10px; line-height: 1; cursor: pointer; transition: background .18s, color .18s; }
  .control:hover { background: #fff; color: #77509a; }
  .control:focus-visible { outline: 2px solid #b699db; outline-offset: 3px; }
  .control svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .control[aria-pressed="true"] { background: #ebe2f480; color: #836495; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (max-height: 430px) { footer { bottom: 12px; } .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main aria-label="An interactive recreation of the purple fingerprint button">
  <div class="stage" id="stage">
    <div class="button-position" id="button-position">
      <button class="action" id="action" aria-label="Take action. Press to leave a fingerprint." aria-describedby="hint">
        <span class="shadow" id="shadow"></span>
        <span class="base"></span>
        <span class="face" id="face"><canvas id="prints" width="736" height="232" aria-hidden="true"></canvas><span class="label">take action</span></span>
      </button>
      <div class="demo-cursor" id="demo-cursor" aria-hidden="true">
        <svg viewBox="0 0 16 21"><path d="M5.1 11.1V2.8c0-1.6 2.4-1.6 2.4 0v5.1c.6-1.1 2.3-.8 2.4.5.9-1 2.6-.1 2.5 1 .8-.7 2.2-.1 2.2 1.1v3.4c0 3.4-1.9 5.5-5.3 5.5-2.6 0-3.8-1.1-5.1-3.3L1.8 12c-.7-1.3 1.1-2.5 2.1-1.4l1.2 1.2" fill="white" stroke="#57505f" stroke-width="1.1" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>
</main>
<footer>
  <p class="hint" id="hint">Press anywhere. Leave a little trace.</p>
  <div class="controls">
    <button class="control" id="replay" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M3 5a5.4 5.4 0 1 1-.5 5M3 1.5V5h3.5"/></svg><span id="replay-label">Replay</span></button>
    <button class="control" id="clear"><svg viewBox="0 0 16 16"><path d="m9.5 2 4.5 4.5-7 7H4L1 10.5zM5 6.5l4.5 4.5M6.5 13.5H15"/></svg>Clear prints</button>
  </div>
</footer>
<p class="sr-only" role="status" id="status"></p>
<script>
(() => {
  'use strict';
  const action = document.getElementById('action');
  const face = document.getElementById('face');
  const shadow = document.getElementById('shadow');
  const canvas = document.getElementById('prints');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const position = document.getElementById('button-position');
  const cursor = document.getElementById('demo-cursor');
  const replay = document.getElementById('replay');
  const replayLabel = document.getElementById('replay-label');
  const status = document.getElementById('status');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const W = 184, H = 58, RES = 4;
  const clamp = (v, lo=0, hi=1) => Math.max(lo, Math.min(hi, v));
  const smooth = v => { v = clamp(v); return v*v*(3-2*v); };
  let prints = [], textureIndex = 0, pressure = 0, velocity = 0, target = 0;
  let activePointer = null, keyboardDown = false, scale = 1;
  let demo = false, demoStart = 0, demoIndex = 0, lastTime = 0, raf = 0;
  let lastPaint = -1, clearedAt = 0;

  function resize() {
    scale = stage.getBoundingClientRect().width / 524;
    position.style.setProperty('--stage-scale', scale);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // A seeded, warped ridge field. These textures are generated here; no
  // screenshot, image asset, external font, library, or network is used.
  function random(seed) {
    return () => { seed |= 0; seed = seed + 0x6d2b79f5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t ^= t + Math.imul(t ^ t >>> 7, 61 | t); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function makePrint(seed) {
    const rnd = random(seed), tw = 240, th = 272;
    const tex = document.createElement('canvas'); tex.width = tw; tex.height = th;
    const tc = tex.getContext('2d'), pixels = tc.createImageData(tw, th);
    const phase = rnd()*6.28, coreX = (rnd()-.5)*.22, coreY = -.18+rnd()*.15;
    for (let y=0; y<th; y++) for (let x=0; x<tw; x++) {
      const nx=(x/tw-.5)*2, ny=(y/th-.5)*2;
      const wx=nx + .07*Math.sin(ny*4.5+phase) + .022*Math.sin(ny*13+nx*7);
      const wy=ny + .026*Math.sin(nx*12+phase) + .016*Math.sin(ny*16-nx*9);
      const ex=wx/(.91-.12*ny), ey=wy/.94;
      const envelope=1-Math.sqrt(ex*ex+ey*ey);
      const irregular=.025*Math.sin(nx*59+ny*33)+.015*Math.sin(ny*87-nx*51);
      const edge=smooth((envelope+irregular)*6);
      if (!edge) continue;
      const dx=wx-coreX, dy=(wy-coreY)*.92;
      const r=Math.sqrt(dx*dx+dy*dy);
      const theta=Math.atan2(dy, dx);
      // The off-center whorl and two scales of distortion keep the ridges
      // irregular, like a partial oily impression rather than an icon.
      const field=r*158 + theta*.9 + 1.9*Math.sin(wy*4+wx*2+phase) + .38*Math.sin(wx*22+wy*16);
      const wave=Math.sin(field);
      const ridge=smooth((wave+.23)/1.1);
      const mottled=clamp(.57 + .22*Math.sin(nx*15+ny*8+phase)*Math.sin(ny*19-nx*7) + .13*Math.sin(nx*31-ny*26));
      const broken=rnd()>.16 ? .45+rnd()*.55 : .035;
      const lit=clamp(.80-.22*nx+.12*Math.sin(ny*4));
      const alpha=edge*((ridge*.66*broken+.071)*mottled*lit);
      const i=(y*tw+x)*4;
      pixels.data[i]=251; pixels.data[i+1]=240; pixels.data[i+2]=255; pixels.data[i+3]=Math.round(alpha*255);
    }
    tc.putImageData(pixels,0,0);
    return tex;
  }
  const textures = Array.from({length: 7}, (_, i) => makePrint(83+i*1019));

  function addPrint(x, y, strength=1, angle, now=performance.now()) {
    // Cap accumulated impressions for long sessions without changing the
    // appearance of the short reference sequence.
    if (prints.length >= 32) prints.shift();
    const i = textureIndex++;
    prints.push({ x, y, strength, angle: angle ?? (-.45+(i%5)*.23), born: now,
      texture: textures[i%textures.length], size: .93+(i%3)*.055 });
    lastPaint=-1;
    wake();
  }
  function paintPrints(now) {
    const changing = prints.some(p => now-p.born<180) || clearedAt>0;
    if (!changing && lastPaint===prints.length) return;
    ctx.setTransform(RES,0,0,RES,0,0); ctx.clearRect(0,0,W,H);
    const clearFade = clearedAt ? 1-smooth((now-clearedAt)/260) : 1;
    for (const p of prints) {
      const age=now-p.born, grow=reducedMotion.matches ? 1 : smooth(age/125);
      ctx.save(); ctx.translate(p.x,p.y+1); ctx.rotate(p.angle);
      const stretch=p.size*(.93+.07*grow);
      ctx.scale(stretch,stretch);
      ctx.globalAlpha=p.strength*grow*clearFade;
      ctx.drawImage(p.texture,-27,-32,54,64); ctx.restore();
    }
    if (clearFade===0) { prints=[]; clearedAt=0; }
    lastPaint=changing ? -1 : prints.length;
  }
  function wipe(animate=true) {
    if (animate && prints.length && !reducedMotion.matches) clearedAt=performance.now();
    else { prints=[]; clearedAt=0; }
    textureIndex=0; lastPaint=-1; wake();
  }
  function renderPressure() {
    const p=clamp(pressure,-.06,1.05);
    face.style.transform=`translateY(${(p*5.5).toFixed(3)}px) scaleX(${(1-p*.011).toFixed(5)})`;
    shadow.style.opacity=(.19-p*.10).toFixed(3);
    shadow.style.transform=`translateY(${(5-p*3).toFixed(3)}px) scale(${(1-p*.025).toFixed(4)})`;
    shadow.style.filter=`blur(${(7-p*3).toFixed(2)}px)`;
  }
  function wake() { if (!raf) { lastTime=performance.now(); raf=requestAnimationFrame(frame); } }
  function press() { target=1; wake(); }
  function release() { target=0; wake(); }
  function point(event) {
    const r=action.getBoundingClientRect();
    return { x:clamp((event.clientX-r.left)/scale,2,W-2), y:clamp((event.clientY-r.top)/scale-pressure*5.5,2,H-2) };
  }
  function stopDemo() {
    demo=false; cursor.style.opacity='0'; replay.setAttribute('aria-pressed','false'); replayLabel.textContent='Replay';
    release();
  }
  action.addEventListener('pointerenter', event => { if (event.isTrusted && demo) stopDemo(); });
  action.addEventListener('pointerdown', event => {
    if (event.button!==0 || activePointer!==null) return;
    stopDemo(); activePointer=event.pointerId; action.setPointerCapture(event.pointerId);
    clearedAt=0; const p=point(event); press(); addPrint(p.x,p.y,1.05);
    status.textContent='Fingerprint added.';
  });
  function pointerUp(event) {
    if (activePointer!==event.pointerId) return;
    activePointer=null; release();
  }
  action.addEventListener('pointerup',pointerUp);
  action.addEventListener('pointercancel',pointerUp);
  action.addEventListener('lostpointercapture',pointerUp);
  action.addEventListener('keydown', event => {
    if (event.code!=='Space' && event.code!=='Enter') return;
    event.preventDefault();
    if (event.repeat || keyboardDown) return;
    stopDemo(); keyboardDown=true; clearedAt=0; press(); addPrint(W/2,H/2,1.05);
    status.textContent='Fingerprint added.';
  });
  action.addEventListener('keyup', event => {
    if (event.code==='Space' || event.code==='Enter') { event.preventDefault(); keyboardDown=false; release(); }
  });
  action.addEventListener('click', event => {
    // Assistive technology can dispatch a click without pointer/key events.
    if (event.detail===0 && !keyboardDown && target===0 && !prints.some(p=>performance.now()-p.born<250)) {
      stopDemo(); addPrint(W/2,H/2,1.05); press(); setTimeout(release,100);
    }
  });
  addEventListener('blur', () => { activePointer=null; keyboardDown=false; release(); });
  replay.addEventListener('click', () => { if (demo) stopDemo(); else startDemo(); });
  document.getElementById('clear').addEventListener('click', () => {
    stopDemo(); wipe(); status.textContent='Fingerprints cleared.';
  });

  // Approximate media-relative timings inferred from the bundled detail frames.
  // The capture's first ~0.26 s is a stale pre-playback image. It is deliberately
  // excluded. The five recorded CSS transitions belonged to the surrounding
  // webpage, so they do not supply the button's easing or duration.
  const presses = [
    {t:1.19, end:1.40, x:28, y:37, strength:.48, a:-.46},
    {t:1.83, end:2.01, x:153, y:33, strength:.9, a:.41},
    {t:2.40, end:2.64, x:35, y:33, strength:1.1, a:.17},
    {t:2.92, end:3.10, x:87, y:22, strength:.18, a:.18},
    {t:3.34, end:3.60, x:13, y:9, strength:.8, a:-.65},
    {t:4.08, end:4.72, x:25, y:39, strength:.62, a:-.30},
    {t:5.04, end:5.24, x:81, y:35, strength:.92, a:-.50},
    {t:5.67, end:5.87, x:79, y:31, strength:.58, a:-.56},
    {t:6.30, end:6.50, x:64, y:22, strength:.23, a:.05},
    {t:6.84, end:7.04, x:18, y:35, strength:.35, a:.3},
    {t:7.77, end:8.01, x:116, y:34, strength:.88, a:-.5}
  ];
  const path = [
    [0,106,123],[.22,62,43],[.60,56,40],[.99,28,37],[1.43,32,36],
    [1.64,151,36],[1.83,153,33],[2.17,35,34],[2.65,36,29],
    [2.82,87,22],[3.12,59,25],[3.28,13,9],[3.60,17,22],
    [3.93,25,39],[4.80,25,39],[4.99,81,35],[5.33,149,38],
    [5.52,80,31],[5.94,67,-3],[6.11,64,22],[6.59,18,35],
    [7.13,164,-6],[7.44,148,31],[7.63,116,34],[8.04,106,123]
  ];
  function cursorAt(t) {
    let n=1; while(n<path.length-1 && t>path[n][0]) n++;
    const a=path[n-1], b=path[n], v=smooth((t-a[0])/(b[0]-a[0]));
    return {x:a[1]+(b[1]-a[1])*v,y:a[2]+(b[2]-a[2])*v};
  }
  function startDemo() {
    activePointer=null; keyboardDown=false; wipe(false); pressure=0; velocity=0; target=0;
    demo=true; demoStart=performance.now(); demoIndex=0;
    replay.setAttribute('aria-pressed','true'); replayLabel.textContent='Stop replay';
    status.textContent='Playing the reconstructed eight-second sequence.'; wake();
  }
  function updateDemo(now) {
    const t=(now-demoStart)/1000;
    while(demoIndex<presses.length && t>=presses[demoIndex].t) {
      const p=presses[demoIndex++]; addPrint(p.x,p.y,p.strength,p.a,demoStart+p.t*1000);
    }
    target=presses.some(p=>t>=p.t && t<p.end) ? 1 : 0;
    const p=cursorAt(Math.min(t,8.04));
    cursor.style.transform=`translate(${(p.x-4).toFixed(2)}px, ${(p.y-1+pressure*4).toFixed(2)}px)`;
    cursor.style.opacity=t<.18 ? String(smooth(t/.18)) : '1';
    if (t>=8.08) { stopDemo(); wipe(); status.textContent='Replay complete. Try pressing the button yourself.'; }
  }
  function frame(now) {
    raf=0;
    const dt=Math.min((now-lastTime)/1000,.032); lastTime=now;
    if (demo) updateDemo(now);
    if (reducedMotion.matches) { pressure=target; velocity=0; }
    else {
      // A damped spring creates a small, quick mechanical return.
      const steps=3, h=dt/steps;
      for(let i=0;i<steps;i++) {
        velocity += ((target-pressure)*610-velocity*34)*h;
        pressure += velocity*h;
      }
      if(Math.abs(pressure-target)<.0003 && Math.abs(velocity)<.004) { pressure=target; velocity=0; }
    }
    renderPressure(); paintPrints(now);
    const moving=demo || Math.abs(pressure-target)>.0001 || Math.abs(velocity)>.001 || clearedAt || prints.some(p=>now-p.born<180);
    if(moving && !raf) raf=requestAnimationFrame(frame);
  }
  // Hidden pages do not keep running a demonstration or hold a pressed button.
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) { stopDemo(); activePointer=null; keyboardDown=false; }
  });
  reducedMotion.addEventListener('change', () => { if(reducedMotion.matches) stopDemo(); wake(); });
  if(!reducedMotion.matches) startDemo(); else wake();
})();
</script>
</body>
</html>
