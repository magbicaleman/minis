<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Take action — motion reconstruction</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2f9;color:#6b6379;font:13px Arial,sans-serif;min-height:100svh;display:grid;grid-template-rows:1fr auto}main{display:grid;place-items:center;min-height:360px}.scene{position:relative;width:min(100vw,1048px);aspect-ratio:1048/776;display:grid;place-items:center}.assembly{position:relative;width:368px;height:128px;transform:scale(var(--scale,1));transform-origin:center}.base{position:absolute;inset:10px 0 0;border-radius:27px;background:linear-gradient(#8b46eb,#571bc1);box-shadow:0 12px 22px #44236a24,0 3px 5px #4b1e8026}.key{--down:0;appearance:none;position:absolute;inset:0 0 10px;width:100%;border-radius:27px;border:1px solid #d0aeff;outline:none;cursor:pointer;overflow:hidden;color:white;background:linear-gradient(180deg,#a475fa 0%,#8a4af4 21%,#7b36ee 75%,#8747f5 100%);box-shadow:inset 0 2px 3px #e5cfff9c,inset 2px 0 5px #d7b4ff60,inset -2px 0 5px #c099ff70,inset 0 -3px 3px #cbaaefb0,0 0 13px #a969f32b;transform:translateY(calc(var(--down)*10px));touch-action:manipulation;-webkit-tap-highlight-color:transparent}.key:focus-visible{outline:3px solid #471693;outline-offset:8px}.key:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 25% 0%,#ecd7ff2b,transparent 70%);pointer-events:none}.key span{position:relative;font-size:44px;font-weight:600;letter-spacing:-1.3px;text-shadow:0 1px 2px #fff3;pointer-events:none}.key canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.cursor{position:absolute;width:20px;height:25px;z-index:3;pointer-events:none;filter:drop-shadow(0 1px 1px #0006);opacity:0}.controls{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:24px 20px 30px}.controls button{font:inherit;color:#645972;background:transparent;border:1px solid #d8d0e1;border-radius:7px;padding:8px 12px;cursor:pointer}.controls input{accent-color:#8343e8;width:145px}.controls label{display:flex;align-items:center;gap:8px}.note{width:100%;text-align:center;font-size:11px;color:#91889e} @media(max-width:500px){.assembly{--scale:.76}.controls{gap:12px}} 
</style>
<main><div class="scene"><div class="assembly"><div class="base"></div><button class="key" aria-label="Take action"><canvas width="736" height="236"></canvas><span>take action</span></button><svg class="cursor" viewBox="0 0 20 25"><path d="M4 2 16 14 10 15 13 22 10 23 7 16 3 20Z" fill="white" stroke="#514a5c" stroke-width="1.3"/></svg></div></div></main>
<div class="controls"><button id="play">Pause demo</button><button id="replay">Replay</button><label>Speed <input id="speed" type="range" min="0.25" max="1.5" value="1" step="0.25"><output id="rate">1×</output></label><span id="time">0.00 / 8.53s</span><div class="note">Offline reconstruction from the supplied frames · press the button to try it</div></div>
<script>
const key=document.querySelector('.key'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),cursor=document.querySelector('.cursor'),play=document.querySelector('#play');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let running=!reduced,t=0,last=0,speed=1,manual=false,down=0,marks=[];
// Approximate press/release moments inferred from the supplied transition images.
const presses=[{t:1.02,x:67,y:66,r:-.55},{t:2.13,x:295,y:68,r:.4},{t:3.16,x:173,y:52,r:-.18},{t:3.66,x:63,y:48,r:-.7},{t:4.35,x:113,y:67,r:.14},{t:4.78,x:230,y:65,r:.45},{t:5.96,x:39,y:39,r:-.62},{t:6.55,x:143,y:67,r:.58},{t:7.13,x:280,y:70,r:.2}];
function stamp(x,y,rotation,alpha,seed){ctx.save();ctx.translate(x*2,y*2);ctx.rotate(rotation);ctx.scale(1.35,1.65);ctx.lineWidth=.7;ctx.strokeStyle=`rgba(242,221,255,${alpha})`;for(let j=0;j<28;j++){let radius=3+j*1.13;ctx.beginPath();for(let k=0;k<=100;k++){let a=k/100*Math.PI*2;let wobble=Math.sin(a*3+j*.23)*1.05+Math.sin(a*7+seed)*.45;let xx=Math.cos(a)*(radius+wobble), yy=Math.sin(a)*(radius*1.15+wobble);xx+=Math.sin(yy*.055)*4; if(k===0)ctx.moveTo(xx,yy);else if(Math.sin(k*7.7+j*4.3+seed)>.94)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,736,236);for(const m of marks){let age=t-m.t;if(age<0)continue;let a=Math.min(1,age/.075)*Math.max(0,1-age/6.1);stamp(m.x,m.y,m.r,.31*a,m.t*17)}key.style.setProperty('--down',down);document.querySelector('#time').textContent=`${Math.min(t,8.53).toFixed(2)} / 8.53s`}
function pose(){marks=presses.filter(p=>p.t<=t);let target=0;for(const p of presses){let age=t-p.t;if(age>=0&&age<.22)target=Math.max(target,age<.07?age/.07:age<.14?1:1-(age-.14)/.08)}down=target;let next=presses.find(p=>p.t+.22>t)||{x:225,y:225,t:9};let prev=[{x:65,y:130,t:0},...presses].filter(p=>p.t<t).at(-1);let f=Math.min(1,Math.max(0,(t-(prev?.t||0)-.25)/.48));f=f*f*(3-2*f);let x=(prev?.x||65)+(next.x-(prev?.x||65))*f,y=(prev?.y||130)+(next.y-(prev?.y||130))*f;cursor.style.transform=`translate(${x}px,${y}px)`;cursor.style.opacity=t>.5&&t<8.25?'1':'0';}
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(running&&!manual){t+=dt*speed;if(t>9.3)t=0;pose()}draw();requestAnimationFrame(frame)}
function pause(){running=false;play.textContent='Play demo';cursor.style.opacity=0}
play.onclick=()=>{running=!running;manual=false;play.textContent=running?'Pause demo':'Play demo'};
document.querySelector('#replay').onclick=()=>{t=0;marks=[];manual=false;running=true;play.textContent='Pause demo'};
document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#rate').textContent=speed+'×'};
function press(x,y){pause();manual=true;down=1;marks.push({t:t-.08,x,y,r:(x/368-.5),});draw()}
key.onpointerdown=e=>{key.setPointerCapture(e.pointerId);let b=key.getBoundingClientRect();press((e.clientX-b.left)/b.width*368,(e.clientY-b.top)/b.height*118)};
function release(){if(!manual)return;let begin=performance.now();function spring(now){down=Math.max(0,1-(now-begin)/140);draw();if(down>0)requestAnimationFrame(spring)}requestAnimationFrame(spring)}
key.onpointerup=release;key.onpointercancel=release;key.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();press(184,59)}};key.onkeyup=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();release()}};
if(reduced)play.textContent='Play demo';
window.motionDemo={seek(seconds){pause();manual=false;t=seconds;pose();draw()},getState(){return{t,running,down,marks:marks.length}}};
requestAnimationFrame(frame);
</script>
</html>
