<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<link rel="icon" href="data:," />
<title>LIQUID CHROME — SDF raymarcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: rgba(230, 240, 255, 0.72);
    text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  }
  .title {
    position: absolute; left: 28px; bottom: 28px;
    animation: rise 1.4s cubic-bezier(.2,.8,.2,1) both;
  }
  .title h1 {
    font-size: clamp(22px, 3.4vw, 40px);
    font-weight: 500; letter-spacing: 0.34em; color: #eef6ff;
  }
  .title p {
    margin-top: 10px; font-size: 11px; letter-spacing: 0.18em;
    color: rgba(160, 220, 255, 0.75); text-transform: uppercase;
  }
  .hint {
    position: absolute; right: 28px; bottom: 28px; text-align: right;
    font-size: 10px; letter-spacing: 0.16em; line-height: 1.9;
    color: rgba(180, 195, 220, 0.55); text-transform: uppercase;
    animation: rise 1.4s 0.25s cubic-bezier(.2,.8,.2,1) both;
  }
  .stack {
    position: absolute; left: 28px; top: 28px;
    font-size: 10px; letter-spacing: 0.14em; line-height: 1.9;
    color: rgba(140, 200, 255, 0.5); text-transform: uppercase;
    border-left: 1px solid rgba(120, 220, 255, 0.25);
    padding-left: 12px;
    animation: rise 1.4s 0.4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="stack">
    raymarched sdf<br/>
    smin metaballs<br/>
    thin-film iridescence<br/>
    soft shadows · ao<br/>
    planar reflection<br/>
    bloom · ca · aces
  </div>
  <div class="title">
    <h1>LIQUID CHROME</h1>
    <p>a tiny world of merging light</p>
  </div>
  <div class="hint">
    move — entice the blob<br/>
    click — shockwave<br/>
    drag — orbit bias
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  powerPreference: 'high-performance',
  stencil: false
});
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const scene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
scene.add(quad);

const vertexShader = /* glsl */`
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const sceneFragment = /* glsl */`
precision highp float;

uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;
uniform vec2 uClick;
uniform float uClickTime;

vec3 gCursor;
vec3 gClickW;
float gPulse;

float hash13(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(
      mix(hash13(i + vec3(0.0, 0.0, 0.0)), hash13(i + vec3(1.0, 0.0, 0.0)), f.x),
      mix(hash13(i + vec3(0.0, 1.0, 0.0)), hash13(i + vec3(1.0, 1.0, 0.0)), f.x),
      f.y
    ),
    mix(
      mix(hash13(i + vec3(0.0, 0.0, 1.0)), hash13(i + vec3(1.0, 0.0, 1.0)), f.x),
      mix(hash13(i + vec3(0.0, 1.0, 1.0)), hash13(i + vec3(1.0, 1.0, 1.0)), f.x),
      f.y
    ),
    f.z
  );
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

void cameraSetup(vec2 p, out vec3 ro, out vec3 ta, out mat3 cam) {
  float ang = uTime * 0.11;
  ro = vec3(sin(ang) * 4.6, 1.35 + 0.18 * sin(uTime * 0.23), cos(ang) * 4.6);
  ta = vec3(uMouse.x * 0.45, 0.10 + uMouse.y * 0.22, 0.0);
  vec3 cw = normalize(ta - ro);
  vec3 cu = normalize(cross(cw, vec3(0.0, 1.0, 0.0)));
  vec3 cv = cross(cu, cw);
  cam = mat3(cu, cv, cw);
}

vec3 unprojectToPlane(vec2 mp, vec3 ro, vec3 ta, mat3 cam, float planeY) {
  vec3 rd = normalize(cam * vec3(mp, 1.7));
  float denom = rd.y;
  float t = (planeY - ro.y) / denom;
  if (!(t > 0.4 && t < 24.0)) {
    t = 5.5;
    vec3 w = ro + rd * t;
    w.y = planeY;
    return w;
  }
  vec3 w = ro + rd * t;
  float r = length(w.xz);
  if (r > 2.6) w.xz *= 2.6 / r;
  return w;
}

float blobField(vec3 p) {
  float d = 1e9;
  float grow = 1.0 + 0.28 * gPulse;

  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    float a = uTime * (0.34 + 0.07 * fi) + fi * 1.9;
    float rad = 1.05 + 0.32 * sin(fi * 2.1 + uTime * 0.15);
    vec3 c = vec3(
      cos(a) * rad,
      0.18 * sin(uTime * 0.75 + fi * 1.35),
      sin(a * 0.92 + fi * 0.4) * rad
    );
    float r = (0.34 + 0.10 * sin(uTime * 1.35 + fi * 2.2)) * grow;
    d = smin(d, length(p - c) - r, 0.48);
  }

  float cr = (0.36 + 0.05 * sin(uTime * 3.1)) * (1.0 + 0.35 * gPulse);
  d = smin(d, length(p - gCursor) - cr, 0.58);
  return d;
}

vec2 map(vec3 p) {
  float b = blobField(p);
  float g = p.y + 1.0;
  float k = 0.28;
  float h = clamp(0.5 + 0.5 * (g - b) / k, 0.0, 1.0);
  float dist = mix(g, b, h) - k * h * (1.0 - h);
  float id = h > 0.5 ? 1.0 : 2.0;
  return vec2(dist, id);
}

float march(vec3 ro, vec3 rd, float tmax, float maxSteps, out float mat) {
  float t = 0.02;
  mat = -1.0;
  for (int i = 0; i < 110; i++) {
    if (float(i) >= maxSteps || t > tmax) break;
    vec3 p = ro + rd * t;
    vec2 h = map(p);
    if (h.x < 0.0014 * t) {
      mat = h.y;
      return t;
    }
    t += h.x * 0.92;
  }
  return -1.0;
}

vec3 calcNormal(vec3 p) {
  const vec2 e = vec2(1.0, -1.0) * 0.0015;
  return normalize(
    e.xyy * map(p + e.xyy).x +
    e.yyx * map(p + e.yyx).x +
    e.yxy * map(p + e.yxy).x +
    e.xxx * map(p + e.xxx).x
  );
}

float softShadow(vec3 ro, vec3 rd, float k) {
  float res = 1.0;
  float t = 0.06;
  for (int i = 0; i < 36; i++) {
    float h = map(ro + rd * t).x;
    res = min(res, k * h / t);
    t += clamp(h, 0.025, 0.4);
    if (res < 0.015 || t > 9.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n) {
  float occ = 0.0;
  float sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = 0.02 + 0.13 * float(i);
    float d = map(p + n * h).x;
    occ += (h - d) * sca;
    sca *= 0.86;
  }
  return clamp(1.0 - 1.45 * occ, 0.0, 1.0);
}

vec3 sky(vec3 rd) {
  float y = clamp(rd.y, -1.0, 1.0);
  vec3 zen = vec3(0.004, 0.006, 0.016);
  vec3 hor = vec3(0.05, 0.02, 0.08);
  vec3 col = mix(hor, zen, smoothstep(-0.15, 0.7, y));

  float sun = pow(max(dot(rd, normalize(vec3(0.5, 0.35, 0.4))), 0.0), 40.0);
  col += vec3(1.0, 0.45, 0.35) * sun * 0.55;

  col += vec3(0.2, 0.05, 0.35) * pow(1.0 - abs(y), 6.0) * 0.45;

  vec3 sp = floor(rd * 220.0);
  float s = hash13(sp);
  float star = smoothstep(0.994, 1.0, s);
  col += vec3(0.75, 0.85, 1.0) * star * smoothstep(0.15, 0.55, y) * 0.9;

  if (y > -0.05) {
    float n1 = noise3(vec3(rd.x * 2.2, rd.z * 2.2, uTime * 0.12));
    float ribbon = smoothstep(0.5, 0.9, n1)
      * smoothstep(-0.05, 0.3, y)
      * smoothstep(1.0, 0.35, y);
    col += vec3(0.05, 0.7, 0.4) * ribbon * 0.5;

    float n2 = noise3(vec3(rd.z * 3.1 + 17.0, rd.x * 1.4, uTime * 0.09));
    float ribbon2 = smoothstep(0.58, 0.95, n2)
      * smoothstep(0.0, 0.45, y)
      * smoothstep(1.0, 0.5, y);
    col += vec3(0.45, 0.1, 0.85) * ribbon2 * 0.35;
  }

  return col;
}

vec3 iridescence(float t) {
  return 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + t));
}

vec3 ringGlow(vec3 p) {
  float age = uTime - uClickTime;
  if (age < 0.0 || age > 4.5) return vec3(0.0);
  float r = age * 3.0;
  float dist = length(p.xz - gClickW.xz);
  float band = exp(-pow(dist - r, 2.0) * 5.0) * exp(-age * 0.85);
  float flash = exp(-dist * 2.2) * exp(-age * 2.5);
  return vec3(0.3, 0.9, 1.0) * (band * 2.4 + flash * 3.5);
}

vec3 shadeBlob(vec3 p, vec3 n, vec3 rd, float doShadow) {
  vec3 L = normalize(vec3(0.5, 0.82, 0.35));
  vec3 ref = reflect(rd, n);
  float fres = pow(clamp(1.0 + dot(rd, n), 0.0, 1.0), 5.0);
  float ndl = max(dot(n, L), 0.0);
  float sh = doShadow > 0.5 ? softShadow(p + n * 0.03, L, 10.0) : 1.0;
  float occ = calcAO(p, n);

  vec3 env = sky(ref);
  float spec = pow(max(dot(ref, L), 0.0), 90.0);

  float film = dot(n, normalize(vec3(0.25, 0.55, 0.75))) * 1.6
    + fres * 2.2
    + uTime * 0.04;
  vec3 irid = iridescence(film);
  vec3 base = mix(vec3(0.75), irid, 0.85);

  vec3 col = env * base * (0.45 + 0.55 * occ);
  col += vec3(1.0, 0.96, 0.92) * spec * sh * 4.5;
  col += vec3(0.1, 0.15, 0.28) * ndl * sh * 0.45;
  col += fres * env * 1.6;

  float cd = length(p - gCursor);
  col += vec3(0.15, 0.8, 1.0) * exp(-cd * 3.2) * (0.55 + 0.8 * gPulse);
  col += ringGlow(p);

  return col;
}

vec3 shadeGround(vec3 p, vec3 n, vec3 rd) {
  vec3 L = normalize(vec3(0.5, 0.82, 0.35));
  float ndl = max(dot(n, L), 0.0);
  float sh = softShadow(p + n * 0.04, L, 7.0);
  float occ = calcAO(p, n);

  vec3 base = vec3(0.02, 0.022, 0.035);
  vec3 col = base * (0.35 + 0.75 * ndl * sh) * occ;

  vec3 rr = reflect(rd, n);
  float rmat;
  float t2 = march(p + n * 0.03, rr, 28.0, 64.0, rmat);
  vec3 rc;
  if (t2 > 0.0) {
    vec3 p2 = p + rr * t2;
    vec3 n2 = calcNormal(p2);
    rc = shadeBlob(p2, n2, rr, 0.0);
  } else {
    rc = sky(rr);
  }

  float fres = pow(clamp(1.0 + dot(rd, n), 0.0, 1.0), 4.0);
  float refAmt = mix(0.1, 0.55, fres);
  col += rc * refAmt * occ;

  col += ringGlow(p) * 0.65;
  return col;
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag * 2.0 - uRes) / uRes.y;

  vec3 ro, ta;
  mat3 cam;
  cameraSetup(p, ro, ta, cam);

  gCursor = unprojectToPlane(uMouse, ro, ta, cam, 0.35);
  gClickW = unprojectToPlane(uClick, ro, ta, cam, 0.0);

  float age = uTime - uClickTime;
  gPulse = (age >= 0.0 && age < 3.0) ? exp(-age * 1.6) : 0.0;

  vec3 rd = normalize(cam * vec3(p, 1.7));

  float mat;
  float t = march(ro, rd, 42.0, 110.0, mat);

  vec3 col;
  if (t > 0.0) {
    vec3 hit = ro + rd * t;
    vec3 n = calcNormal(hit);
    if (mat > 1.5) {
      col = shadeGround(hit, n, rd);
    } else {
      col = shadeBlob(hit, n, rd, 1.0);
    }
    float fog = 1.0 - exp(-0.008 * t * t);
    col = mix(col, sky(rd), fog);
  } else {
    col = sky(rd);
  }

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
`;

const postFragment = /* glsl */`
precision highp float;

uniform sampler2D tDiffuse;
uniform vec2 uRes;
uniform float uTime;
uniform float uExposure;
varying vec2 vUv;

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = vUv;
  vec2 c = uv - 0.5;
  float r2 = dot(c, c);

  float ca = 0.0015 + r2 * 0.012;
  vec3 col;
  col.r = texture2D(tDiffuse, uv + c * ca).r;
  col.g = texture2D(tDiffuse, uv).g;
  col.b = texture2D(tDiffuse, uv - c * ca).b;

  vec2 px = 1.0 / uRes;
  vec3 bl = vec3(0.0);
  for (int i = 0; i < 8; i++) {
    float a = 6.28318 * float(i) / 8.0;
    vec2 o = vec2(cos(a), sin(a));
    bl += texture2D(tDiffuse, uv + o * px * 5.0).rgb;
    bl += texture2D(tDiffuse, uv + o * px * 11.0).rgb;
  }
  bl /= 16.0;
  col += max(bl - 0.75, 0.0) * 0.3;

  col *= uExposure;
  col = aces(col);
  col = pow(col, vec3(1.0 / 2.2));

  col *= 1.0 - smoothstep(0.1, 0.7, r2) * 0.65;

  float g = fract(sin(dot(uv * uRes + mod(uTime, 10.0) * 61.7, vec2(12.9898, 78.233))) * 43758.5453);
  col += (g - 0.5) * 0.03;

  gl_FragColor = vec4(col, 1.0);
}
`;

const sceneU = {
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },
  uMouse: { value: new THREE.Vector2(0, 0) },
  uClick: { value: new THREE.Vector2(0, 0) },
  uClickTime: { value: -1000 }
};

const postU = {
  tDiffuse: { value: null },
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },
  uExposure: { value: 1.0 }
};

const sceneMat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader: sceneFragment,
  uniforms: sceneU,
  depthTest: false,
  depthWrite: false
});

const postMat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader: postFragment,
  uniforms: postU,
  depthTest: false,
  depthWrite: false
});

function makeRT() {
  return new THREE.WebGLRenderTarget(1, 1, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: false,
    stencilBuffer: false
  });
}
const rts = [makeRT(), makeRT()];
let rtIndex = 0;

const clock = new THREE.Clock();
const mouseTarget = new THREE.Vector2(0, 0);
const mouseSmooth = new THREE.Vector2(0, 0);

function toShaderPlane(x, y) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  return new THREE.Vector2(
    (2 * x - w) / h,
    (h - 2 * y) / h
  );
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);

  const bw = Math.max(1, Math.floor(w * dpr));
  const bh = Math.max(1, Math.floor(h * dpr));
  rts[0].setSize(bw, bh);
  rts[1].setSize(bw, bh);
  sceneU.uRes.value.set(bw, bh);
  postU.uRes.value.set(bw, bh);
}

window.addEventListener('resize', resize);
resize();

window.addEventListener('pointermove', (e) => {
  mouseTarget.copy(toShaderPlane(e.clientX, e.clientY));
});

window.addEventListener('pointerdown', (e) => {
  mouseTarget.copy(toShaderPlane(e.clientX, e.clientY));
  sceneU.uClick.value.copy(toShaderPlane(e.clientX, e.clientY));
  sceneU.uClickTime.value = clock.getElapsedTime();
});

function frame() {
  const t = clock.getElapsedTime();
  mouseSmooth.lerp(mouseTarget, 0.075);

  sceneU.uTime.value = t;
  sceneU.uMouse.value.copy(mouseSmooth);
  postU.uTime.value = t;

  const dst = rts[rtIndex];

  quad.material = sceneMat;
  renderer.setRenderTarget(dst);
  renderer.render(scene, camera);

  quad.material = postMat;
  postU.tDiffuse.value = dst.texture;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  rtIndex ^= 1;

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
